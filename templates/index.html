<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bless Canteen - Weekly Meal Ordering</title>
  <link rel="stylesheet" href="/static/css/styles.css">
  <link rel="stylesheet" href="/static/css/icons.css">
</head>
<body>
  <!-- Header -->
  <header class="header" id="header">
    <!-- Rendered by JavaScript -->
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="container">
      <!-- Hero Section -->
      <section class="hero-section">
        <h1 class="hero-title">Weekly Menu</h1>
        <p class="hero-subtitle">
          Order fresh, nutritious meals prepared daily by our school kitchen.
          Plan your entire week of meals in one session!
        </p>
      </section>

      <!-- Week Selector & Day Picker -->
      <section id="week-selector">
        <!-- Rendered by JavaScript -->
      </section>

      <!-- Meal Period Tabs -->
      <section id="meal-period-tabs">
        <!-- Rendered by JavaScript -->
      </section>

      <!-- Search and Category Filters -->
      <section id="search-filters">
        <!-- Rendered by JavaScript -->
      </section>

      <!-- Menu Grid -->
      <section id="menu-grid">
        <!-- Rendered by JavaScript -->
      </section>
    </div>
  </main>

  <!-- Cart Sidebar -->
  <div class="cart-overlay" id="cart-overlay" onclick="toggleCart()"></div>
  <aside class="cart-sidebar" id="cart-sidebar">
    <div class="cart-header">
      <h2 class="cart-title" id="cart-title">
        <!-- Rendered by JavaScript -->
      </h2>
      <button class="cart-close" onclick="toggleCart()">
        <!-- Close icon SVG -->
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    
    <div class="cart-body" id="cart-body">
      <!-- Cart items rendered by JavaScript -->
    </div>
    
    <div class="cart-footer" id="cart-footer">
      <!-- Cart footer rendered by JavaScript -->
    </div>
  </aside>

  <!-- Order Confirmation Modal -->
  <div class="modal-overlay" id="order-modal">
    <div id="order-modal-content">
      <!-- Modal content rendered by JavaScript -->
    </div>
  </div>

  <!-- Footer -->
  <footer id="footer">
    <!-- Rendered by JavaScript -->
  </footer>

  <!-- JavaScript -->
  <script src="/static/js/app.js"></script>
</body>
</html>
